name: Validate Skills

on:
  push:
    paths: ['skills/**', '.claude-plugin/**', '.cursor-plugin/**']
  pull_request:
    paths:
      - 'skills/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.github/workflows/validate-skills.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install skills-ref
        run: pip install "skills-ref @ git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"

      - name: Validate all skills
        run: |
          failed=0
          shopt -s nullglob
          found=0
          for skill in skills/*/skills/*/; do
            [ -f "$skill/SKILL.md" ] || continue
            found=1
            echo "── $skill"
            skills-ref validate "$skill" || failed=1

            lines=$(wc -l < "$skill/SKILL.md")
            if [ "$lines" -gt 500 ]; then
              echo "  ⚠ SKILL.md is $lines lines (500 recommended) — not failing the build"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "✗ No skills found under skills/*/skills/*/SKILL.md"
            failed=1
          fi
          exit $failed

      - name: Check pipeline-validation hook
        run: |
          pip install pyyaml
          python3 skills/orchestra/hooks/test_validate_pipeline.py

      - name: Validate manifests are valid JSON
        run: |
          failed=0
          for manifest in \
            .claude-plugin/marketplace.json \
            .cursor-plugin/marketplace.json \
            skills/*/.claude-plugin/plugin.json \
            skills/*/.cursor-plugin/plugin.json; do
            [ -f "$manifest" ] || continue
            echo "── $manifest"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$manifest" || failed=1
          done
          exit $failed

      - name: Check every skill is exposed by a plugin
        run: |
          failed=0
          # Each plugin listed in the Claude marketplace must point at a real
          # plugin dir, and every skill on disk must live under such a plugin.
          for src in $(python3 -c "import json; [print(p['source']) for p in json.load(open('.claude-plugin/marketplace.json'))['plugins']]"); do
            dir="${src#./}"
            if [ ! -f "$dir/.claude-plugin/plugin.json" ]; then
              echo "✗ Plugin source $src has no .claude-plugin/plugin.json"
              failed=1
            fi
            if [ ! -d "$dir/skills" ]; then
              echo "✗ Plugin source $src has no skills/ directory"
              failed=1
            fi
          done
          for skill in skills/*/skills/*/; do
            [ -f "$skill/SKILL.md" ] || continue
            plugin_root="${skill%%/skills/*}"
            if [ ! -f "$plugin_root/.claude-plugin/plugin.json" ]; then
              echo "✗ Skill $skill is not inside a plugin (no $plugin_root/.claude-plugin/plugin.json)"
              failed=1
            fi
          done
          exit $failed

      - name: Check every orchestra-plugin skill is registered in the Tessl manifest
        run: |
          # Unlike the Claude/Cursor manifests (which auto-discover skills from the
          # folder), .tessl-plugin/plugin.json requires each skill's path listed
          # explicitly (see AGENTS.md) — this has silently drifted out of sync with
          # disk twice already (a missed skill addition, twice, each time surfacing
          # later as a `tessl plugin publish` failure rather than at PR time). Only
          # covers skills/orchestra — migrate-to-orchestra is deliberately excluded
          # from Tessl for now (see AGENTS.md).
          #
          # NOT_YET_IN_TESSL: skills that exist on disk but are deliberately withheld
          # from the manifest (not ready to publish yet) — same rationale as
          # migrate-to-orchestra, documented in AGENTS.md. Add a skill here only when
          # that's a real, intentional decision, not to silence this check.
          NOT_YET_IN_TESSL="databricks-cost-audit databricks-cost-drivers"
          failed=0
          for skill in skills/orchestra/skills/*/; do
            [ -f "$skill/SKILL.md" ] || continue
            base="$(basename "$skill")"
            case " $NOT_YET_IN_TESSL " in
              *" $base "*) continue ;;
            esac
            name="skills/orchestra/skills/$base"
            if ! python3 -c "import json,sys; sys.exit(0 if sys.argv[1] in json.load(open('.tessl-plugin/plugin.json'))['skills'] else 1)" "$name"; then
              echo "✗ $name has a SKILL.md but is missing from .tessl-plugin/plugin.json's skills array"
              failed=1
            fi
          done
          exit $failed

      - name: Check every plugin's manifest version was bumped when its content changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Each plugin under skills/<plugin>/ ships two manifests
          # (.claude-plugin/plugin.json, .cursor-plugin/plugin.json) whose `version`
          # is the only signal a client has that the plugin's content changed — it
          # isn't auto-derived from disk. A PR that edits a plugin's skills/hooks/
          # references without also bumping both manifests' version ships silently
          # stale to Claude/Cursor. This mirrors the Tessl-specific version-bump
          # check in tessl-skill-checks.yml, generalised to every plugin/manifest
          # pair instead of just .tessl-plugin/plugin.json.
          python3 - <<'PY'
          import json, os, subprocess, sys

          base_sha = os.environ["BASE_SHA"]
          failed = False

          def read_version(path, ref=None):
              try:
                  if ref:
                      raw = subprocess.run(
                          ["git", "show", f"{ref}:{path}"],
                          capture_output=True, text=True, check=True,
                      ).stdout
                  elif os.path.isfile(path):
                      raw = open(path).read()
                  else:
                      return None
                  return json.loads(raw)["version"]
              except (subprocess.CalledProcessError, json.JSONDecodeError, KeyError):
                  return None

          def parse(v):
              return tuple(int(x) for x in v.split("."))

          for plugin_dir in sorted(os.listdir("skills")):
              root = f"skills/{plugin_dir}"
              claude_manifest = f"{root}/.claude-plugin/plugin.json"
              cursor_manifest = f"{root}/.cursor-plugin/plugin.json"
              if not os.path.isfile(claude_manifest):
                  continue

              changed = subprocess.run(
                  ["git", "diff", "--name-only", base_sha, "HEAD", "--", root],
                  capture_output=True, text=True, check=True,
              ).stdout.splitlines()
              content_changed = [f for f in changed if f not in (claude_manifest, cursor_manifest)]
              if not content_changed:
                  continue

              print(f"── {root} changed:")
              for f in content_changed:
                  print(f"    {f}")

              for manifest in (claude_manifest, cursor_manifest):
                  base_v = read_version(manifest, base_sha)
                  head_v = read_version(manifest)
                  if head_v is None:
                      print(f"::error file={manifest}::couldn't read a 'version' field")
                      failed = True
                  elif base_v is not None and parse(head_v) <= parse(base_v):
                      print(
                          f"::error file={manifest}::version wasn't bumped forward "
                          f"({base_v} -> {head_v}), but {root} content changed in this PR. "
                          f"Bump 'version' in both {claude_manifest} and {cursor_manifest}."
                      )
                      failed = True

          sys.exit(1 if failed else 0)
          PY
