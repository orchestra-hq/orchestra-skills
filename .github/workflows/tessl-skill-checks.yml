name: Tessl Skill Checks

# Runs the Tessl skill checks used before `tessl plugin publish` (see tessl-publish.yml):
#   - `tessl skill lint` validates the whole plugin package (deterministic, structural) and
#     gates the PR.
#   - `tessl review run quality` runs an LLM-judged quality review per modified skill. This is
#     informational only (posted to the job summary, never fails the check) because:
#       1. Its score is non-deterministic run-to-run.
#       2. It packs each skill folder as an independent bundle and can't see this repo's shared
#          `references/orchestra/` docs (see AGENTS.md), so skills that use them get structurally
#          lower "actionability"/"progressive disclosure" scores regardless of actual quality.
#          This is a known limitation of Tessl's bundler (it doesn't resolve cross-skill
#          references), not a defect in the skills — we deliberately keep one shared source of
#          truth under references/orchestra/ rather than duplicating content per skill.

on:
  pull_request:
    paths:
      # migrate-to-orchestra is deliberately excluded from .tessl-plugin/plugin.json for
      # now, so its skills stay out of these path filters too — add
      # 'skills/migrate-to-orchestra/skills/**' back here once it's added to Tessl.
      - 'skills/orchestra/skills/**'
      - 'skills/orchestra/references/orchestra/**'
      - '.tessl-plugin/plugin.json'
      - 'tessl.json'
      - '.tesslignore'

concurrency:
  group: tessl-skill-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint plugin
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}
      - run: tessl skill lint .

  check-version-bump:
    name: Check Tessl version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure .tessl-plugin/plugin.json version moved forward
        run: |
          # This workflow triggers on the same paths tessl-publish.yml watches, i.e.
          # this PR changes what `tessl plugin publish` will publish on merge to main.
          # If the manifest version doesn't move forward in the same PR, publish fails
          # on merge with "<name>@<version> already exists" (see tessl-publish.yml) —
          # this has happened repeatedly (PR #27, #39) because the bump was only a
          # documented manual step (AGENTS.md). Catch it here instead, at PR time.
          base_version=$(git show "${{ github.event.pull_request.base.sha }}:.tessl-plugin/plugin.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          head_version=$(python3 -c "import json; print(json.load(open('.tessl-plugin/plugin.json'))['version'])")

          echo "base version:  $base_version"
          echo "head version:  $head_version"

          python3 -c "
          base = tuple(int(x) for x in '$base_version'.split('.'))
          head = tuple(int(x) for x in '$head_version'.split('.'))
          raise SystemExit(0 if head > base else 1)
          " || {
            echo "::error file=.tessl-plugin/plugin.json::Version wasn't bumped forward ($base_version -> $head_version), but this PR touches content Tessl publishes (skills/orchestra/skills, skills/orchestra/references/orchestra, README.md, tessl.json, or .tesslignore). Bump 'version' in .tessl-plugin/plugin.json (and skills/orchestra/.claude-plugin/plugin.json + .cursor-plugin/plugin.json, per AGENTS.md) or 'tessl plugin publish' will fail on merge with '<name>@<version> already exists'."
            exit 1
          }

  detect-changed-skills:
    name: Detect modified skills
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: detect
        run: |
          git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              -- skills/orchestra/skills/ \
            | awk -F/ 'NF >= 4 { print $4 }' \
            | sort -u \
            | while read -r skill; do
                [ -d "skills/orchestra/skills/$skill" ] && echo "$skill"
                true
              done > changed_skills.txt

          echo "Modified skills:"
          cat changed_skills.txt || true

          json=$(jq -R -s -c 'split("\n") | map(select(length > 0))' changed_skills.txt)
          echo "skills=$json" >> "$GITHUB_OUTPUT"

  review-changed-skills:
    name: Review ${{ matrix.skill }}
    needs: detect-changed-skills
    if: needs.detect-changed-skills.outputs.skills != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.detect-changed-skills.outputs.skills) }}
    steps:
      - uses: actions/checkout@v6
      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Run quality review (informational only — does not fail this check)
        continue-on-error: true
        run: |
          {
            echo "## Tessl quality review: \`${{ matrix.skill }}\`"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          tessl review run quality \
              "skills/orchestra/skills/${{ matrix.skill }}" \
              --workspace "${{ vars.TESSL_WORKSPACE || 'orchestra-hq' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"
