# Incremental-model variant: swap these run_inputs into the dbt-slim-ci and dbt-deploy jobs of
# github-dbt-slim-ci.yml. Requires the modified_incremental selector (templates/dbt/selectors.yml).
#
# A plain `build -s state:modified+` only tests one code path of a changed incremental model.
# On a PR this:
#   1. clones prod relations into ci_<PR number> so incremental models have data to build onto
#      (zero-copy on Snowflake/BigQuery/Databricks; views elsewhere),
#   2. full-refreshes modified incremental models (and their modified ancestors),
#   3. builds everything modified + downstream without --full-refresh, testing is_incremental().
# Skip step 1 to rely on --defer alone; modified incrementals then have no existing CI table.
# The task's commands are `dbt ${{ inputs.dbt_command }}`, so each chained command after `;` starts with `dbt`.

# dbt-slim-ci job:
env:
  COMMON: "--defer --state latest_production --target ci"
with:
  run_inputs: |
    {
      "dbt_command": "clone --state latest_production --target ci; dbt build --full-refresh --selector modified_incremental ${{ env.COMMON }}; dbt build -s state:modified+ ${{ env.COMMON }}",
      "dbt_branch": "${{ github.head_ref }}",
      "dbt_ci_schema_suffix": "${{ github.event.pull_request.number }}"
    }

# dbt-deploy job (same commands, no clone; set COMMON's --target to prod):
#   "dbt_command": "build --full-refresh --selector modified_incremental ${{ env.COMMON }}; dbt build -s state:modified+ ${{ env.COMMON }}",
#   "dbt_branch": "main"
